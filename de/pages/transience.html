<style>@font-face{font-family:Archivo;src:url('/fonts/archivo-black-latin.woff2') format('woff2');font-display:swap;font-weight:400}
@font-face{font-family:DM;src:url('/fonts/dm-sans-latin-variable.woff2') format('woff2');font-display:swap;font-weight:100 900}
:root{color-scheme:dark;font-family:DM,Arial,sans-serif;background:#111810;color:#eee8d6}*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:36px 24px;background:radial-gradient(ellipse at 20% 5%,#9d77452a,transparent 58%),radial-gradient(ellipse at 90% 100%,#44523942,transparent 62%),#111810;position:relative;isolation:isolate}
body:before{content:"";position:fixed;z-index:-1;pointer-events:none;inset:24px;border-left:1px solid #b7804c88;border-bottom:1px solid #b7804c55;border-bottom-left-radius:32px}
body:after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.17;background:repeating-linear-gradient(113deg,transparent 0 3px,#e4c79208 3px 4px)}
main{width:100%;max-width:820px;padding:clamp(34px,7vw,88px) clamp(2px,4vw,42px);text-align:center}
.line{display:block;width:68px;height:3px;border-radius:3px;margin:0 auto 38px;background:linear-gradient(90deg,#633a24,#deb37b 46%,#a26336);box-shadow:0 0 28px #e1ac6340}
h1{font-family:Archivo,Arial,sans-serif;font-weight:400;font-size:clamp(30px,7.5vw,68px);line-height:1.12;letter-spacing:-.045em;margin:0 0 42px;color:#efe9d7}h1 span{color:#d8bc78}
.pause{font-family:Georgia,serif;font-weight:400;font-size:clamp(24px,4vw,34px);line-height:1.35;margin:0 0 20px;text-wrap:balance}
.contact{font-size:clamp(15px,2vw,17px);line-height:1.7;color:#c8c6b5;margin:0 0 22px}
a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;max-width:100%;padding:10px 2px;color:#e4c98d;font-size:clamp(16px,2.5vw,21px);line-height:1.5;text-decoration:none;border-bottom:1px solid #c99c5b88;overflow-wrap:anywhere}
a:hover{color:#fff1cf;border-bottom-color:currentColor}a:focus-visible{outline:2px solid #edce8c;outline-offset:7px;border-radius:2px}
@media(max-width:420px){body{padding:28px 24px}body:before{inset:14px;border-bottom-left-radius:24px}h1{margin-bottom:32px}.line{margin-bottom:30px}}
@media(forced-colors:active){.line{background:CanvasText}a{border-color:LinkText}}
</style>

<body>
<main>
<span class="line" aria-hidden="true"></span>
<h1 aria-label="PRAYZVIBES"><span>PRAYZ</span>VIBES</h1>
