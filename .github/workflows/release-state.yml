name: Update release state

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Release phase to publish
        required: true
        default: auto
        type: choice
        options:
          - auto
          - before
          - single
          - ep
  schedule:
    - cron: "5 22 30 7 *"
    - cron: "5 22 6 8 *"

permissions:
  contents: write

jobs:
  update-release-state:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Apply current release phase
        run: node scripts/apply-release-phase.mjs --phase "${{ github.event.inputs.phase || 'auto' }}"

      - name: Commit changed release copy
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Release copy is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html de/index.html fr/index.html
          git commit -m "Update PRAYZVIBES release state"
          git push
